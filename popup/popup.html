<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="../icons/icon48.png" alt="" width="20" height="20" />
      <span>Prompt Lens</span>
    </div>
    <button id="btn-settings" class="text-btn">设置</button>
  </header>

  <div id="key-warning" class="warning hidden">
    还没有配置 Gemini API Key，<a href="#" id="link-options">去设置</a>
  </div>

  <div id="dropzone" class="dropzone" tabindex="0">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
    <p>点击上传 / 拖入 / 粘贴图片<br /><span class="dim">开始反推提示词</span></p>
    <input type="file" id="file-input" accept="image/*" hidden />
  </div>

  <button id="btn-sidepanel" class="secondary">打开侧边栏查看结果</button>

  <p class="hint dim">网页上悬停图片时会出现悬浮球，点击即可反推。</p>

  <script src="popup.js" type="module"></script>
</body>
</html>
