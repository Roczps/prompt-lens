<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Prompt Lens 设置</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main>
    <header class="brand">
      <img src="../icons/icon48.png" alt="" width="28" height="28" />
      <h1>Prompt Lens 设置</h1>
    </header>

    <section class="card">
      <h2>API</h2>
      <label>
        Gemini API Key
        <div class="key-row">
          <input type="password" id="apiKey" placeholder="AIza..." autocomplete="off" />
          <button id="btn-test" class="chip-btn">测试</button>
        </div>
        <span class="hint">在 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer">Google AI Studio</a> 免费创建。Key 只保存在浏览器本地，直接请求 Google API。</span>
        <span id="test-result" class="hint"></span>
      </label>
      <div class="row">
        <label>
          反推模型
          <input type="text" id="analysisModel" />
          <span class="hint">用于分析图片、反推提示词</span>
        </label>
        <label>
          生图模型
          <input type="text" id="imageModel" />
          <span class="hint">Nano Banana 系列图像模型</span>
        </label>
      </div>
    </section>

    <section class="card">
      <h2>GPT-Image 渠道（可选）</h2>
      <label>
        API Key
        <div class="key-row">
          <input type="password" id="openaiApiKey" placeholder="sk-..." autocomplete="off" />
          <button id="btn-test-openai" class="chip-btn">测试</button>
        </div>
        <span class="hint">APIMart 的 Key 在 <a href="https://apimart.ai/keys" target="_blank" rel="noreferrer">apimart.ai/keys</a> 获取；也支持 OpenAI 官方或其他兼容中转的 Key</span>
        <span id="test-openai-result" class="hint"></span>
      </label>
      <div class="row">
        <label>
          接口地址（Base URL）
          <input type="text" id="openaiBaseUrl" placeholder="https://api.apimart.ai/v1" />
          <span class="hint">默认 APIMart，填到 /v1 为止</span>
        </label>
        <label>
          生图模型
          <input type="text" id="openaiImageModel" />
          <span class="hint">默认 gpt-image-2</span>
        </label>
      </div>
      <label>
        接口协议
        <select id="openaiProtocol">
          <option value="auto">自动识别（推荐）</option>
          <option value="apimart">APIMart 异步任务</option>
          <option value="openai">OpenAI 官方同步</option>
        </select>
        <span class="hint">APIMart 等异步中转：提交任务后自动轮询取图；自动识别按接口地址判断</span>
      </label>
    </section>

    <section class="card">
      <h2>Seedream 渠道（Atlas Cloud，可选）</h2>
      <label>
        API Key
        <div class="key-row">
          <input type="password" id="atlasApiKey" placeholder="atlas-..." autocomplete="off" />
          <button id="btn-test-atlas" class="chip-btn">测试</button>
        </div>
        <span class="hint">在 <a href="https://www.atlascloud.ai/console/api-keys" target="_blank" rel="noreferrer">Atlas Cloud 控制台</a> 创建；用于 Seedream 生图</span>
        <span id="test-atlas-result" class="hint"></span>
      </label>
      <label>
        生图模型
        <input type="text" id="atlasImageModel" placeholder="bytedance/seedream-v4.5" />
        <span class="hint">带参考图时自动切换到对应的 /edit 变体</span>
      </label>
    </section>

    <section class="card">
      <h2>本地 ComfyUI（可选）</h2>
      <div class="row">
        <label>
          服务地址
          <div class="key-row">
            <input type="text" id="comfyBaseUrl" placeholder="http://127.0.0.1:8188" />
            <button id="btn-test-comfy" class="chip-btn">测试</button>
          </div>
          <span id="test-comfy-result" class="hint"></span>
        </label>
        <label>
          模型（checkpoint 文件名）
          <input type="text" id="comfyCheckpoint" list="comfy-checkpoints" placeholder="sd_xl_base_1.0.safetensors" />
          <datalist id="comfy-checkpoints"></datalist>
          <span class="hint">点"测试"连通后会自动列出可选模型</span>
        </label>
      </div>
      <div class="row">
        <label>
          采样步数
          <input type="number" id="comfySteps" min="1" max="150" step="1" />
        </label>
        <label>
          CFG
          <input type="number" id="comfyCfg" min="1" max="30" step="0.5" />
        </label>
      </div>
      <label>
        负面提示词
        <input type="text" id="comfyNegative" placeholder="留空使用内置默认负面词" />
      </label>
    </section>

    <section class="card">
      <h2>FlowAgent 视频（可选）</h2>
      <div class="row">
        <label>
          服务地址
          <div class="key-row">
            <input type="text" id="flowagentBaseUrl" placeholder="http://127.0.0.1:8001" />
            <button id="btn-test-flow" class="chip-btn">测试</button>
          </div>
          <span class="hint">本机运行的 FlowAgent（Google Flow 桥接）服务</span>
          <span id="test-flow-result" class="hint"></span>
        </label>
        <label>
          视频模型（可选）
          <input type="text" id="flowagentModel" placeholder="留空用服务默认模型" />
        </label>
      </div>
      <label>
        默认视频时长
        <select id="videoDuration">
          <option value="4">4 秒</option>
          <option value="6">6 秒</option>
          <option value="8">8 秒</option>
          <option value="10">10 秒</option>
        </select>
      </label>
    </section>

    <section class="card">
      <h2>生成默认值</h2>
      <div class="row">
        <label>
          默认生图渠道
          <select id="imageProvider">
            <option value="gemini">Gemini</option>
            <option value="openai">GPT-Image</option>
            <option value="seedream">Seedream</option>
            <option value="comfy">ComfyUI（本地）</option>
          </select>
        </label>
        <label>
          默认画幅
          <select id="aspectRatio">
            <option value="1:1">1:1</option>
            <option value="4:3">4:3</option>
            <option value="3:4">3:4</option>
            <option value="16:9">16:9</option>
            <option value="9:16">9:16</option>
            <option value="3:2">3:2</option>
            <option value="2:3">2:3</option>
            <option value="21:9">21:9</option>
          </select>
        </label>
        <label>
          默认分辨率
          <select id="imageSize">
            <option value="512">512</option>
            <option value="1K">1K</option>
            <option value="2K">2K</option>
            <option value="4K">4K</option>
          </select>
        </label>
      </div>
    </section>

    <section class="card">
      <h2>悬浮球</h2>
      <label class="check">
        <input type="checkbox" id="ballEnabled" />
        在网页图片上显示悬浮球
      </label>
      <label>
        图片最小尺寸（px）
        <input type="number" id="minImageSize" min="40" max="600" step="10" />
        <span class="hint">宽高都超过这个值的图片才会显示悬浮球</span>
      </label>
    </section>

    <div class="actions">
      <button id="btn-save" class="primary">保存设置</button>
      <span id="save-result" class="hint"></span>
    </div>
  </main>
  <script src="options.js" type="module"></script>
</body>
</html>
