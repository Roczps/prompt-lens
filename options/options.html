<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Prompt Lens 设置</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main>
    <header class="brand">
      <img src="../icons/icon48.png" alt="" width="28" height="28" />
      <h1>Prompt Lens 设置</h1>
    </header>

    <section class="card">
      <h2>API</h2>
      <label>
        Gemini API Key
        <div class="key-row">
          <input type="password" id="apiKey" placeholder="AIza..." autocomplete="off" />
          <button id="btn-test" class="chip-btn">测试</button>
        </div>
        <span class="hint">在 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer">Google AI Studio</a> 免费创建。Key 只保存在浏览器本地，直接请求 Google API。</span>
        <span id="test-result" class="hint"></span>
      </label>
      <div class="row">
        <label>
          反推模型
          <input type="text" id="analysisModel" />
          <span class="hint">用于分析图片、反推提示词</span>
        </label>
        <label>
          生图模型
          <input type="text" id="imageModel" />
          <span class="hint">Nano Banana 系列图像模型</span>
        </label>
      </div>
    </section>

    <section class="card">
      <h2>GPT-Image 渠道（可选）</h2>
      <label>
        API Key
        <div class="key-row">
          <input type="password" id="openaiApiKey" placeholder="sk-..." autocomplete="off" />
          <button id="btn-test-openai" class="chip-btn">测试</button>
        </div>
        <span class="hint">APIMart 的 Key 在 <a href="https://apimart.ai/keys" target="_blank" rel="noreferrer">apimart.ai/keys</a> 获取；也支持 OpenAI 官方或其他兼容中转的 Key</span>
        <span id="test-openai-result" class="hint"></span>
      </label>
      <div class="row">
        <label>
          接口地址（Base URL）
          <input type="text" id="openaiBaseUrl" placeholder="https://api.apimart.ai/v1" />
          <span class="hint">默认 APIMart，填到 /v1 为止</span>
        </label>
        <label>
          生图模型
          <input type="text" id="openaiImageModel" />
          <span class="hint">默认 gpt-image-2</span>
        </label>
      </div>
      <label>
        接口协议
        <select id="openaiProtocol">
          <option value="auto">自动识别（推荐）</option>
          <option value="apimart">APIMart 异步任务</option>
          <option value="openai">OpenAI 官方同步</option>
        </select>
        <span class="hint">APIMart 等异步中转：提交任务后自动轮询取图；自动识别按接口地址判断</span>
      </label>
    </section>

    <section class="card">
      <h2>Seedream 渠道（Atlas Cloud，可选）</h2>
      <label>
        API Key
        <div class="key-row">
          <input type="password" id="atlasApiKey" placeholder="apikey-...（Atlas Cloud 秘密密钥）" autocomplete="off" />
          <button id="btn-test-atlas" class="chip-btn">测试</button>
        </div>
        <span class="hint">在 <a href="https://www.atlascloud.ai/console/api-keys" target="_blank" rel="noreferrer">Atlas Cloud 控制台</a> 创建；必须是 Atlas Cloud 的秘密密钥（通常以 apikey- 开头），不能填公开 ID（ak_）或其他平台 Key。测试不保存设置，修改后请点击下方“保存设置”</span>
        <span id="test-atlas-result" class="hint"></span>
      </label>
      <label>
        生图模型
        <input type="text" id="atlasImageModel" placeholder="bytedance/seedream-v5.0-pro/text-to-image" />
        <span class="hint">带参考图时自动切换到对应的 /edit 变体；Seedream 5.0 Pro 约 $0.045/张（2K 满档 $0.09）</span>
      </label>
    </section>

    <section class="card">
      <h2>Grok / grok2api（可选）</h2>
      <label>服务地址（可带 /v1）
        <div class="key-row">
          <input type="text" id="grokBaseUrl" placeholder="http://127.0.0.1:8000/v1" />
          <button id="btn-test-grok" class="chip-btn">测试</button>
        </div>
        <span id="test-grok-result" class="hint"></span>
      </label>
      <label>API Key（服务未启用鉴权时可留空）
        <input type="password" id="grokApiKey" autocomplete="off" />
      </label>
      <div class="row">
        <label>文生图模型<input type="text" id="grokImageModel" list="grok-models" /></label>
        <label>参考图编辑模型<input type="text" id="grokEditModel" list="grok-models" /></label>
      </div>
      <datalist id="grok-models"></datalist>
      <label>参考图接口协议
        <select id="grokEditProtocol">
          <option value="json">JSON（本机 Go 版 grok2api）</option>
          <option value="multipart">Multipart（Python 版 grok2api）</option>
        </select>
      </label>
      <p class="hint">本机 Go 版地址为 http://127.0.0.1:8000/v1，需要后台创建的客户端 API Key。旧默认 8011 地址首次读取时会自动迁移到 8000。</p>
      <p class="hint">参考图／角色卡自动走编辑模型。画幅映射到 1:1、16:9、9:16、3:2、2:3；分辨率由后端决定。同步请求不支持断点续传，连接中断后请先检查后台结果。</p>
    </section>

    <section class="card">
      <h2>FlowKit 视频（可选）</h2>
      <div class="row">
        <label>
          FlowKit 地址
          <div class="key-row">
            <input type="text" id="flowkitBaseUrl" placeholder="http://127.0.0.1:8111" />
            <button id="btn-test-flow" class="chip-btn">测试</button>
          </div>
          <span class="hint">仅连接本机 FlowKit，无需 Key。测试只检查服务和可用账号，不会生成视频。</span>
          <span id="test-flow-result" class="hint"></span>
        </label>
      </div>
      <label>
        默认文生视频时长（图生视频固定 8 秒）
        <select id="videoDuration">
          <option value="4">4 秒</option>
          <option value="6">6 秒</option>
          <option value="8">8 秒</option>
          <option value="10">10 秒</option>
        </select>
      </label>
    </section>

    <section class="card">
      <h2>生成默认值</h2>
      <div class="row">
        <label>
          默认生图渠道
          <select id="imageProvider">
            <option value="gemini">Gemini</option>
            <option value="openai">GPT-Image</option>
            <option value="seedream">Seedream</option>
            <option value="grok">Grok（grok2api）</option>
          </select>
        </label>
        <label>
          默认画幅
          <select id="aspectRatio">
            <option value="1:1">1:1</option>
            <option value="4:3">4:3</option>
            <option value="3:4">3:4</option>
            <option value="16:9">16:9</option>
            <option value="9:16">9:16</option>
            <option value="3:2">3:2</option>
            <option value="2:3">2:3</option>
            <option value="21:9">21:9</option>
          </select>
        </label>
        <label>
          默认分辨率
          <select id="imageSize">
            <option value="512">512</option>
            <option value="1K">1K</option>
            <option value="2K">2K</option>
            <option value="4K">4K</option>
          </select>
        </label>
      </div>
    </section>

    <section class="card">
      <h2>悬浮球</h2>
      <label class="check">
        <input type="checkbox" id="ballEnabled" />
        在网页图片上显示悬浮球
      </label>
      <label>
        图片最小尺寸（px）
        <input type="number" id="minImageSize" min="40" max="600" step="10" />
        <span class="hint">宽高都超过这个值的图片才会显示悬浮球</span>
      </label>
    </section>

    <div class="actions">
      <button id="btn-save" class="primary">保存设置</button>
      <span id="save-result" class="hint"></span>
    </div>
  </main>
  <script src="options.js" type="module"></script>
</body>
</html>
